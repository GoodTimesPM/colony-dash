<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colony Dash</title>

<!--
  The colony, and the controls for it.

  Two typographic rules run through the whole page. Anything the ledger
  *measured* is set in mono, anything a human *wrote* is set in sans — token
  counts, timestamps, roles, ids and statuses are machine facts; story titles,
  findings and escalation reasons are prose. And colour is rationed: amber
  belongs to the PO Inbox and nothing else, so a page with amber on it means
  something wants Jordan. Mint means live work. Coral means an anomaly.

  Since M3 the page can also write. Every control that does routes through
  POST /api/act/*, which is a thin skin over control.py — the module that
  records the decision before it takes effect and refuses anything the colony's
  rules forbid. Nothing on this page spends a token: approving a story marks it
  dispatchable and the next wake decides. That separation is deliberate, and it
  is why a mis-click here is cheap.
-->

<link rel="stylesheet" href="app.css">

<header class="bar">
  <h1>Colony Dash</h1>
  <span class="goal" id="goal"></span>
  <span class="conn" id="conn" data-live="false"><span class="dot"></span><span id="conn-text">connecting</span></span>
  <select class="pick" id="theme" title="theme">
    <option value="">system</option>
    <optgroup label="the originals">
      <option value="light">daylight</option>
      <option value="dark">basalt</option>
      <option value="ember">ember</option>
      <option value="moss">moss</option>
      <option value="slate">slate</option>
      <option value="parchment">parchment</option>
    </optgroup>
    <optgroup label="eras">
      <option value="diner">diner · 1955</option>
      <option value="miami">miami · 1986</option>
      <option value="y2k">y2k · 1999</option>
    </optgroup>
    <optgroup label="worlds">
      <option value="cyberpunk">cyberpunk</option>
      <option value="neon-noir">neon noir</option>
      <option value="grid">grid</option>
      <option value="vault">vault</option>
      <option value="imperial">imperial</option>
      <option value="nostromo">nostromo</option>
      <option value="bridge">bridge</option>
      <option value="meadow">meadow</option>
    </optgroup>
    <optgroup label="terminals">
      <option value="phosphor">phosphor</option>
      <option value="ochre-crt">ochre crt</option>
      <option value="dusk">dusk</option>
      <option value="fjord">fjord</option>
      <option value="kiln">kiln</option>
      <option value="blueprint">blueprint</option>
      <option value="inkwash">ink wash</option>
    </optgroup>
  </select>
  <details class="viewmenu" id="filemenu">
    <summary title="manual and configuration">file</summary>
    <div class="menu">
      <div class="lb">help</div>
      <button class="link" id="open-manual">manual</button>
    </div>
  </details>
  <button class="link" id="open-appearance" title="text size, colors and tile layout">appearance</button>
  <details class="viewmenu" id="viewmenu">
    <summary title="choose what this page shows">view</summary>
    <div class="menu">
      <div class="lb">panels</div>
      <label><input type="checkbox" data-view="sprint" checked> sprint</label>
      <label><input type="checkbox" data-view="inbox" checked> PO inbox</label>
      <label><input type="checkbox" data-view="flight" checked> ticket queue</label>
      <label><input type="checkbox" data-view="ordis" checked> Ordis</label>
      <label><input type="checkbox" data-view="colony" checked> colony</label>
      <label><input type="checkbox" data-view="standby" checked> standby</label>
      <label><input type="checkbox" data-view="board" checked> board</label>
      <label><input type="checkbox" data-view="completed" checked> completed</label>
      <label><input type="checkbox" data-view="files" checked> files</label>
      <label><input type="checkbox" data-view="spend" checked> spend</label>
      <label><input type="checkbox" data-view="macros" checked> macros</label>
      <label><input type="checkbox" data-view="pulse" checked> pulse log</label>
      <label><input type="checkbox" data-view="forge" checked> forge</label>
      <hr class="macro-rule">
      <div class="lb">detail</div>
      <label><input type="checkbox" data-view="stale"> stale questions</label>
      <label><input type="checkbox" data-view="dropped"> dropped stories</label>
      <label><input type="checkbox" data-view="filed"> done / shelved / not started</label>
      <label><input type="checkbox" data-view="dense"> dense rows</label>
      <button class="link" id="view-reset">show everything</button>
    </div>
  </details>
</header>

<div class="snapbar" id="snapbar">
  <span>drag a tile where you want it</span>
  <button class="act go" id="snap-done">done</button>
</div>

<div class="halt-banner">
  <span>⛔ production halted</span>
  <span id="halt-why" style="text-transform:none;letter-spacing:0"></span>
  <button class="act go" id="halt-banner-resume" style="margin-left:auto">resume</button>
</div>

<section class="sprint" data-panel="sprint">
  <div>
    <div class="figure">
      <span class="big" id="spend-tok">—</span>
      <span class="dim mono" id="spend-usd"></span>
      <span class="soft" id="spend-of"></span>
    </div>
    <div class="meta" id="sprint-meta"></div>
  </div>
  <div class="meta" id="week-meta" style="justify-self:end"></div>
  <div class="gauge" id="gauge"><i style="width:0"></i></div>
</section>

<div class="strip-row">
  <section class="strip" id="inbox-strip" data-panel="inbox">
    <h2>PO Inbox <span class="count" id="inbox-count"></span>
      <button class="link" id="inbox-show-stale" style="display:none" title="stale questions are ones the story has moved past">stale</button>
    </h2>
    <div class="tiles" id="inbox"></div>
  </section>
  <section class="strip flight" id="flight-strip" data-panel="flight">
    <h2>Ticket Queue <span class="count" id="flight-count"></span></h2>
    <div class="rail" id="flight"></div>
  </section>
</div>

<main>
  <div class="col">
    <section class="panel ordis" data-panel="ordis">
      <h2>Ordis <span class="count" id="ordis-count"></span></h2>
      <div class="body" id="ordis"></div>
    </section>
    <section class="panel" data-panel="colony">
      <h2>Colony <span class="count" id="colony-count"></span></h2>
      <div class="body" id="colony"></div>
    </section>
    <section class="panel" data-panel="standby">
      <h2>Standby <span class="count" id="roster-count"></span></h2>
      <div class="body">
        <input class="search" id="roster-q" placeholder="search personas, or browse below" autocomplete="off">
        <div id="roster-results" style="display:flex;flex-direction:column;gap:2px"></div>
        <div id="roster-divisions"></div>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="panel" data-panel="board">
      <h2>Board <span class="count" id="board-count"></span>
        <button class="link" id="board-filed" style="display:none" title="done, shipped, shelved or not started — the colony asks nothing about these">filed</button>
        <button class="link" id="board-dropped" style="display:none" title="stories you have dropped">dropped</button>
      </h2>
      <div class="flow" id="flow"></div>
      <div class="body" id="stories" style="gap:2px"></div>
    </section>
    <section class="panel" data-panel="completed">
      <h2>Completed <span class="count" id="completed-count"></span>
        <button class="link" data-done="all" title="every finished thing, newest first">all</button>
        <button class="link" data-done="dispatch" title="implement tickets that delivered a patch">dispatches</button>
        <button class="link" data-done="story" title="stories you filed as done, shipped or shelved">stories</button>
      </h2>
      <div class="done-list" id="completed"></div>
    </section>
    <section class="panel" data-panel="files">
      <h2>Files <span class="count" id="proj-count"></span>
        <button class="link" data-sort="changes" title="most changed first — the pulse's own order">changes</button>
        <button class="link" data-sort="recent" title="whichever folder you touched last, first">recent</button>
        <button class="link" data-sort="name" title="alphabetical">name</button>
        <button class="link" id="tree-refresh" title="re-read the working tree">refresh</button>
      </h2>
      <div class="body" style="gap:8px">
        <div id="projects" style="display:flex;flex-direction:column;gap:3px"></div>
        <hr class="macro-rule">
        <input class="search" id="tree-q" placeholder="filter this folder" autocomplete="off">
        <div class="tree" id="tree"></div>
      </div>
    </section>
    <section class="panel" data-panel="spend">
      <h2>Spend <span class="count" id="spend-count"></span></h2>
      <div class="body">
        <div class="chartbar">
          <div class="seg" id="spend-grain">
            <button data-grain="hour" title="the last 48 hours">hour</button>
            <button data-grain="day" title="the last 30 days">day</button>
            <button data-grain="week" title="the last 26 weeks, Monday to Monday">week</button>
            <button data-grain="month" title="the last 12 months">month</button>
            <button data-grain="year" title="the last 5 years">year</button>
          </div>
          <div class="spendnav">
            <button id="spend-prev" title="the window before this one">&#171;</button>
            <input type="date" id="spend-date" title="jump the window to a date">
            <button id="spend-next" title="the window after this one">&#187;</button>
            <button id="spend-now" title="back to the present">now</button>
          </div>
          <div class="seg spacer" id="spend-kind">
            <button data-kind="line" title="spend as a curve over time">line</button>
            <button data-kind="bar" title="spend as one bar per bucket">bar</button>
          </div>
        </div>
        <div class="chart" id="spend-chart">
          <div class="readout" id="spend-readout"></div>
          <svg id="spend-svg"></svg>
        </div>
        <div id="by-role" style="display:flex;flex-direction:column;gap:7px"></div>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="panel" data-panel="macros">
      <h2>Macros</h2>
      <div class="body" id="macros"></div>
    </section>
    <section class="panel" data-panel="pulse">
      <h2>Pulse log <span class="count" id="pulse-count"></span></h2>
      <div class="body" id="pulses" style="gap:2px"></div>
    </section>
    <section class="panel" data-panel="forge">
      <h2>Forge <span class="count" id="forge-count"></span></h2>
      <div class="body" id="forge"></div>
    </section>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <div style="flex:1;min-width:0">
      <div class="mono dim" style="font-size:var(--step--2);letter-spacing:.1em;text-transform:uppercase" id="d-eyebrow"></div>
      <h3 id="d-title"></h3>
    </div>
    <button class="link" id="d-back" style="display:none"></button>
    <button class="link" id="d-close">close</button>
  </header>
  <div class="scroll" id="d-body"></div>
</aside>

<div id="toasts"></div>

<script src="app.js"></script>
