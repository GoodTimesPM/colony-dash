<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colony Dash</title>

<!--
  The colony, and the controls for it.

  Two typographic rules run through the whole page. Anything the ledger
  *measured* is set in mono, anything a human *wrote* is set in sans — token
  counts, timestamps, roles, ids and statuses are machine facts; story titles,
  findings and escalation reasons are prose. And colour is rationed: amber
  belongs to the PO Inbox and nothing else, so a page with amber on it means
  something wants Jordan. Mint means live work. Coral means an anomaly.

  Since M3 the page can also write. Every control that does routes through
  POST /api/act/*, which is a thin skin over control.py — the module that
  records the decision before it takes effect and refuses anything the colony's
  rules forbid. Nothing on this page spends a token: approving a story marks it
  dispatchable and the next wake decides. That separation is deliberate, and it
  is why a mis-click here is cheap.
-->

<style>
/* ── palettes ───────────────────────────────────────────────────────────────
   Bare :root is the complete light set. The system-dark block is guarded so an
   explicit light choice beats a dark OS, and [data-theme="dark"] repeats it so
   the picker wins in the other direction. The named themes after that are
   opt-in only — a viewer who never touches the picker sees the first three.   */
:root {
  color-scheme: light dark;

  --ground:      #F2F4F7;
  --panel:       #FFFFFF;
  --panel-sunk:  #EAEDF2;
  --rule:        #DCE1E9;
  --rule-soft:   #E8ECF1;
  --ink:         #131A22;
  --ink-soft:    #47525F;
  --ink-dim:     #7A8593;

  --amber:       #B26A00;
  --amber-ground:#FDF3E2;
  --mint:        #0E8C74;
  --mint-ground: #E3F5F0;
  --coral:       #C0392B;
  --coral-ground:#FBEAE7;
  --violet:      #6B5BC4;

  --shadow: 0 1px 2px rgba(19,26,34,.06), 0 8px 24px -12px rgba(19,26,34,.18);

  --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, "SFMono-Regular", monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;

  --step--1: 11px;
  --step-0:  13px;
  --step-1:  15px;
  --step-2:  19px;
  --step-3:  26px;
}

/* The guard is `:not([data-theme])` — no attribute at all — and not a list of
   the light themes to exclude. The list version was a specificity trap: it
   scored higher than `:root[data-theme="ember"]`, so on a dark OS every named
   theme lost to it and the picker appeared to do nothing except for the two
   light palettes that happened to be named in the exclusions. A theme that is
   chosen is never "system", so the absence of the attribute is the whole
   condition. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --ground:      #0B0F14;
    --panel:       #121820;
    --panel-sunk:  #0E141B;
    --rule:        #1F2933;
    --rule-soft:   #172029;
    --ink:         #DEE5EC;
    --ink-soft:    #9AA7B5;
    --ink-dim:     #6B7885;
    --amber:       #F0A63C;
    --amber-ground:#231A0C;
    --mint:        #6FE3C4;
    --mint-ground: #0D2320;
    --coral:       #E8674F;
    --coral-ground:#26120E;
    --violet:      #A99BF0;
    --shadow: 0 1px 0 rgba(255,255,255,.02), 0 12px 32px -18px #000;
  }
}
:root[data-theme="dark"] {
  --ground:      #0B0F14;  --panel:      #121820;  --panel-sunk: #0E141B;
  --rule:        #1F2933;  --rule-soft:  #172029;
  --ink:         #DEE5EC;  --ink-soft:   #9AA7B5;  --ink-dim:    #6B7885;
  --amber:       #F0A63C;  --amber-ground:#231A0C;
  --mint:        #6FE3C4;  --mint-ground: #0D2320;
  --coral:       #E8674F;  --coral-ground:#26120E;
  --violet:      #A99BF0;
  --shadow: 0 1px 0 rgba(255,255,255,.02), 0 12px 32px -18px #000;
}

/* Ember — the forge at night. Warm ground, iron rules, coals for the accent. */
:root[data-theme="ember"] {
  --ground:      #14100D;  --panel:      #1C1714;  --panel-sunk: #120E0C;
  --rule:        #2E2620;  --rule-soft:  #241D18;
  --ink:         #EDE1D4;  --ink-soft:   #B29C86;  --ink-dim:    #7E6B5A;
  --amber:       #F2A33C;  --amber-ground:#2A1C0B;
  --mint:        #8FC98A;  --mint-ground: #16220F;
  --coral:       #E4614A;  --coral-ground:#2A120E;
  --violet:      #C79A6A;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 14px 34px -18px #000;
}

/* Moss — a longhouse in the woods. Cool green dark, low contrast, easy at 2am. */
:root[data-theme="moss"] {
  --ground:      #0C120F;  --panel:      #131B17;  --panel-sunk: #0F1613;
  --rule:        #1E2A24;  --rule-soft:  #17211C;
  --ink:         #DCE7E0;  --ink-soft:   #94A89C;  --ink-dim:    #66786D;
  --amber:       #D7A94E;  --amber-ground:#221B0C;
  --mint:        #62D3A4;  --mint-ground: #0C2319;
  --coral:       #DD6E5C;  --coral-ground:#241210;
  --violet:      #86B8C9;
  --shadow: 0 1px 0 rgba(255,255,255,.02), 0 12px 32px -18px #000;
}

/* Slate — quarried stone. The neutral dark for when colour is a distraction. */
:root[data-theme="slate"] {
  --ground:      #101317;  --panel:      #191D23;  --panel-sunk: #14181D;
  --rule:        #272D35;  --rule-soft:  #1E232A;
  --ink:         #E2E6EB;  --ink-soft:   #9CA5B0;  --ink-dim:    #6E7783;
  --amber:       #E0A64B;  --amber-ground:#231C0E;
  --mint:        #63C9B4;  --mint-ground: #0F2422;
  --coral:       #DE6E62;  --coral-ground:#241413;
  --violet:      #8FA2D6;
  --shadow: 0 1px 0 rgba(255,255,255,.02), 0 12px 32px -18px #000;
}

/* Parchment — a ledger on a table. Warm paper, iron-gall ink, red rubrication.
   Pushed further into the sepia than the first pass: the panels are tinted
   rather than white-with-a-hint, the rules carry the same hue as the ground,
   and the accents are pigments (ochre, verdigris, vermilion) instead of the
   default palette desaturated. A sepia theme whose panel is #FBF6EB is a white
   theme standing near a candle. */
:root[data-theme="parchment"] {
  --ground:      #E4D5B7;  --panel:      #F2E4C6;  --panel-sunk: #D8C6A2;
  --rule:        #C2A97C;  --rule-soft:  #D2BC95;
  --ink:         #2A1B08;  --ink-soft:   #5C4520;  --ink-dim:    #8C7345;
  --amber:       #8A4A06;  --amber-ground:#EFD9A6;
  --mint:        #2E6A43;  --mint-ground: #D5E0BC;
  --coral:       #992C13;  --coral-ground:#EBD0BC;
  --violet:      #6B4A18;
  --shadow: 0 1px 2px rgba(70,48,18,.12), 0 8px 24px -14px rgba(70,48,18,.4);
}

/* Clay — the daylight version of the same settlement. Cool light, brick accent. */
:root[data-theme="clay"] {
  --ground:      #F4F1EC;  --panel:      #FFFFFF;  --panel-sunk: #ECE7DF;
  --rule:        #DCD5CA;  --rule-soft:  #E7E1D8;
  --ink:         #1E1B17;  --ink-soft:   #524B42;  --ink-dim:    #877E72;
  --amber:       #A85B14;  --amber-ground:#FAEDDC;
  --mint:        #1C7A62;  --mint-ground: #E0F1EA;
  --coral:       #B23A26;  --coral-ground:#F8E4DF;
  --violet:      #6C5B8C;
  --shadow: 0 1px 2px rgba(40,32,24,.06), 0 8px 24px -12px rgba(40,32,24,.2);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim  { color: var(--ink-dim); }
.soft { color: var(--ink-soft); }

/* ── chrome ───────────────────────────────────────────────────────────────── */

header.bar {
  display: flex; align-items: baseline; gap: 14px;
  padding: 12px 20px 10px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
header.bar h1 {
  margin: 0; font-family: var(--mono); font-size: var(--step-0);
  font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
}
header.bar .goal {
  flex: 1; min-width: 0; color: var(--ink-soft);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.link {
  background: none; border: 0; padding: 4px 8px; cursor: pointer;
  color: var(--ink-dim); font-family: var(--mono); font-size: var(--step--1);
  letter-spacing: .1em; text-transform: uppercase; border-radius: 5px;
}
.link:hover { color: var(--ink); background: var(--panel-sunk); }
.link:focus-visible { outline: 2px solid var(--violet); outline-offset: 1px; }

select.pick, input.field {
  background: var(--panel-sunk); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 5px; padding: 4px 7px;
  font-family: var(--mono); font-size: var(--step--1);
  /* A <select> sizes itself to its widest option unless told otherwise, and the
     widest project folder here is `personal-desktop-projects/domain-expansion-news`.
     Inside a tile that is a control wider than the card it sits in, hanging off
     the right edge at every window size. `min-width:0` is the half people forget:
     without it a flex or grid child refuses to shrink below its content. */
  max-width: 100%; min-width: 0;
}
select.pick:focus-visible, input.field:focus-visible { outline: 2px solid var(--violet); outline-offset: -1px; }

.conn { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); }
.conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }
.conn[data-live="false"] { color: var(--coral); }
.conn[data-live="false"] .dot { background: var(--coral); }

/* ── sprint band ──────────────────────────────────────────────────────────── */

.sprint {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 28px;
  align-items: end; padding: 16px 20px 14px;
  border-bottom: 1px solid var(--rule); background: var(--panel);
}
.sprint .figure { display: flex; align-items: baseline; gap: 10px; }
.sprint .big { font-family: var(--mono); font-size: var(--step-3); font-weight: 600; letter-spacing: -.01em; }
.sprint .meta { display: flex; gap: 22px; font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); flex-wrap: wrap; }
.sprint .meta b { font-weight: 600; color: var(--ink-soft); }
.sprint .meta b.boosted { color: var(--amber); }

.gauge { grid-column: 1 / -1; height: 6px; background: var(--panel-sunk); border-radius: 3px; overflow: hidden; position: relative; }
.gauge i { display: block; height: 100%; background: var(--mint); border-radius: 3px; transition: width .4s ease; }
.gauge[data-state="warm"] i { background: var(--amber); }
.gauge[data-state="hot"]  i { background: var(--coral); }

/* The halted colony says so across the whole width. A stop switch you have to
   go looking for to confirm is not a stop switch you trust. */
.halt-banner {
  display: none; align-items: center; gap: 12px;
  padding: 9px 20px; background: var(--coral-ground); color: var(--coral);
  border-bottom: 1px solid var(--coral);
  font-family: var(--mono); font-size: var(--step--1); letter-spacing: .06em; text-transform: uppercase;
}
body.halted .halt-banner { display: flex; }

/* ── the inbox strip ──────────────────────────────────────────────────────────
   Full width, above everything else. The Inbox is the only panel on this page
   that is *about* Jordan, so it is not a column of leftovers in the corner —
   it is the first thing the eye lands on, and it disappears when it is empty. */

.strip { padding: 14px 20px 0; }
.strip h2 {
  margin: 0 0 9px; font-family: var(--mono); font-size: var(--step--1); font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--amber);
  display: flex; align-items: center; gap: 9px;
}
.strip h2 .count { color: var(--ink-soft); letter-spacing: 0; }
.strip.quiet h2 { color: var(--ink-dim); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }

.tile {
  display: flex; flex-direction: column; gap: 6px;
  padding: 11px 13px 12px; border-radius: 8px;
  background: var(--amber-ground); border: 1px solid var(--amber);
  box-shadow: var(--shadow);
}
.tile[data-kind="write-approval"] { border-width: 2px; }
.tile .k { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); display: flex; gap: 8px; }
.tile .k .age { margin-left: auto; color: var(--ink-dim); letter-spacing: 0; }
.tile .r { font-size: var(--step-1); line-height: 1.35; }
.tile .rec { font-size: var(--step--1); color: var(--ink-soft); white-space: pre-wrap; max-height: 8.5em; overflow-y: auto; }
.tile .meta { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
.tile .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: auto; padding-top: 4px; }
/* The picker gets its own row rather than sharing one with the buttons. It is
   the answer to the tile's question; the buttons are what you do with it. */
.tile .picker { display: flex; gap: 6px; align-items: center; width: 100%; min-width: 0; }
.tile .picker select.pick, .tile .picker input.field { flex: 1 1 auto; width: 100%; min-width: 0; }

/* A snoozed item is still open — it just stops shouting until the snooze runs
   out. Everything about it recedes: the amber ground, the border, the type. */
.tile.snoozed {
  background: var(--panel); border-color: var(--rule); box-shadow: none; opacity: .62;
}
.tile.snoozed .k, .tile.snoozed .r { color: var(--ink-dim); }
.tile.snoozed:hover { opacity: 1; }
.tile .snooze-note {
  font-family: var(--mono); font-size: 10px; color: var(--ink-dim);
  letter-spacing: .06em; text-transform: uppercase;
}
/* What Ordis said back, on the face of the tile. A reply you have to open a
   drawer to discover is a reply you will not read. */
.tile .said {
  border-left: 2px solid var(--violet); padding: 4px 0 4px 8px;
  font-size: var(--step--1); color: var(--ink-soft); white-space: pre-wrap;
  max-height: 7em; overflow-y: auto;
}
.tile .waiting {
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--violet);
}

button.act {
  font-family: var(--mono); font-size: var(--step--1); letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 5px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink-soft);
}
button.act:hover { color: var(--ink); border-color: var(--ink-dim); }
button.act:focus-visible { outline: 2px solid var(--violet); outline-offset: 1px; }
button.act[disabled] { opacity: .45; cursor: default; }
button.act.go   { border-color: var(--mint);  color: var(--mint); }
button.act.no   { border-color: var(--coral); color: var(--coral); }
button.act.warn { border-color: var(--amber); color: var(--amber); }
button.act.solid { background: var(--coral); border-color: var(--coral); color: var(--panel); }

/* ── layout ───────────────────────────────────────────────────────────────── */

main {
  display: grid;
  grid-template-columns: minmax(250px, 290px) minmax(0, 1fr) minmax(280px, 320px);
  gap: 14px; padding: 14px 20px 28px; align-items: start;
}
@media (max-width: 1240px) { main { grid-template-columns: minmax(0,1fr); } }

.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

section.panel {
  background: var(--panel); border: 1px solid var(--rule);
  border-radius: 8px; box-shadow: var(--shadow); overflow: hidden;
}
.panel > h2 {
  margin: 0; padding: 10px 13px 9px;
  font-family: var(--mono); font-size: var(--step--1); font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim);
  border-bottom: 1px solid var(--rule-soft);
  display: flex; align-items: center; gap: 8px;
}
.panel > h2 .count { margin-left: auto; color: var(--ink-soft); letter-spacing: 0; }
.panel .body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 9px; }
.empty { color: var(--ink-dim); font-size: var(--step--1); padding: 2px 0 4px; }

/* ── Ordis ────────────────────────────────────────────────────────────────────
   The Scrum Master is not a row in `agents` — it is the loop itself. But a
   colony dashboard that shows every colonist and not the thing running them is
   missing its own supervisor, so it gets a panel: when it last beat, when it
   beats next, and what its judgment has cost. */

.panel.ordis { border-color: var(--violet); }
.panel.ordis > h2 { color: var(--violet); }
.ordis-head { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; }
.ordis-head .sigil {
  width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
  background: var(--panel-sunk); color: var(--violet); font-size: 17px;
  border: 1px solid var(--rule);
}
body.beating .ordis-head .sigil { animation: breathe 3.6s ease-in-out infinite; }
.ordis-head .state { font-family: var(--mono); font-size: var(--step-1); font-weight: 600; }
.ordis-head .sub { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); }
.ordis-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ordis-grid div { background: var(--panel-sunk); border-radius: 6px; padding: 6px 8px; }
.ordis-grid .n { display: block; font-family: var(--mono); font-size: var(--step-1); }
.ordis-grid .lb { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); }
.ordis-said { font-size: var(--step--1); color: var(--ink-soft); }

/* ── colony rail ──────────────────────────────────────────────────────────── */

.agent { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.agent canvas { width: 26px; height: 26px; border-radius: 5px; image-rendering: pixelated; background: var(--panel-sunk); }
.agent .who { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.agent .role { font-family: var(--mono); font-size: var(--step-0); font-weight: 600; }
.agent .scope { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .line { font-size: var(--step--1); color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent.idle { opacity: .62; }
.agent .ceiling { height: 3px; background: var(--panel-sunk); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.agent .ceiling i { display: block; height: 100%; background: var(--mint); }
.agent .ceiling[data-state="hot"] i { background: var(--coral); }
.agent .row-acts { display: flex; gap: 6px; margin-top: 5px; }

.pulsing { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
@media (prefers-reduced-motion: reduce) { .pulsing, .ordis-head .sigil { animation: none } .gauge i { transition: none } }

/* ── standby ──────────────────────────────────────────────────────────────── */

.search {
  width: 100%; padding: 6px 9px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--panel-sunk); color: var(--ink);
  font-family: var(--mono); font-size: var(--step--1);
}
.search:focus-visible { outline: 2px solid var(--violet); outline-offset: -1px; border-color: transparent; }

details.div { border-top: 1px solid var(--rule-soft); }
details.div:first-of-type { border-top: 0; }
details.div > summary {
  cursor: pointer; list-style: none; padding: 6px 2px;
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--mono); font-size: var(--step--1);
}
details.div > summary::-webkit-details-marker { display: none; }
details.div > summary::before { content: "▸"; color: var(--ink-dim); font-size: 9px; width: 9px; }
details.div[open] > summary::before { content: "▾"; }
details.div > summary:hover { color: var(--violet); }
details.div > summary .dn { text-transform: capitalize; }
details.div > summary .cn { margin-left: auto; color: var(--ink-dim); }
details.div .people { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 8px 17px; max-height: 260px; overflow-y: auto; }

button.persona {
  display: flex; gap: 7px; align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 5px; padding: 3px 6px; cursor: pointer;
  color: inherit; font: inherit; font-size: var(--step--1);
}
button.persona:hover { background: var(--panel-sunk); }
button.persona:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
button.persona .nm { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.persona .dv { margin-left: auto; font-family: var(--mono); color: var(--ink-dim); font-size: 10px; }
button.persona.hired .nm { color: var(--mint); }

/* ── board ────────────────────────────────────────────────────────────────── */

.flow { display: flex; gap: 0; padding: 0; border-bottom: 1px solid var(--rule-soft); overflow-x: auto; }
.flow button {
  flex: 1 0 auto; min-width: 84px; padding: 9px 10px 10px;
  background: none; border: 0; border-right: 1px solid var(--rule-soft); cursor: pointer;
  text-align: left; color: inherit; font: inherit;
}
.flow button:last-child { border-right: 0; }
.flow button:hover { background: var(--panel-sunk); }
.flow button[aria-pressed="true"] { background: var(--panel-sunk); box-shadow: inset 0 -2px 0 var(--violet); }
.flow .n { display: block; font-family: var(--mono); font-size: var(--step-2); line-height: 1.1; }
.flow .n.zero { color: var(--ink-dim); }
.flow .lb { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }

.story {
  width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: none; border: 0; border-radius: 6px; padding: 8px 9px;
  display: grid; grid-template-columns: 1fr auto; gap: 3px 12px;
}
.story:hover { background: var(--panel-sunk); }
.story:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
.story .t { font-size: var(--step-1); }
.story .sub { grid-column: 1 / -1; display: flex; text-align: left; gap: 9px; align-items: center; font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); flex-wrap: wrap; }

.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px; background: var(--panel-sunk); color: var(--ink-soft); white-space: nowrap;
}
.chip.attn  { background: var(--amber-ground); color: var(--amber); }
.chip.live  { background: var(--mint-ground);  color: var(--mint); }
.chip.p1::before { content: "▲ "; }

/* An inferred project is a guess the loop is not allowed to act on, so it must
   never look like a confirmed one. Dotted underline = "nobody has said yes". */
.guess { border-bottom: 1px dotted currentColor; }

/* ── projects ─────────────────────────────────────────────────────────────── */

.proj {
  width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: none; border: 0; border-radius: 6px; padding: 6px 8px;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
}
.proj:hover { background: var(--panel-sunk); }
.proj:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
.proj .p { font-family: var(--mono); font-size: var(--step-0); }
.proj .s { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-soft); }
.proj .bar { grid-column: 1 / -1; display: flex; height: 3px; border-radius: 2px; overflow: hidden; background: var(--panel-sunk); }
.proj .bar i { display: block; height: 100%; }
.proj .bar i.a { background: var(--mint); }
.proj .bar i.m { background: var(--violet); }
.proj .bar i.d { background: var(--coral); }
.proj .bar i.u { background: var(--ink-dim); }

/* ── macros ───────────────────────────────────────────────────────────────── */

.macro { display: flex; flex-direction: column; gap: 4px; }
.macro .lb { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.macro .why { font-size: var(--step--1); color: var(--ink-dim); line-height: 1.4; }
.macro .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.macro-rule { border: 0; border-top: 1px solid var(--rule-soft); margin: 3px 0; }
button.big {
  width: 100%; padding: 11px; border-radius: 7px; cursor: pointer;
  font-family: var(--mono); font-size: var(--step-1); font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
  border: 2px solid var(--coral); background: var(--coral-ground); color: var(--coral);
}
button.big:hover { background: var(--coral); color: var(--panel); }
button.big:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
button.big.resume { border-color: var(--mint); background: var(--mint-ground); color: var(--mint); }
button.big.resume:hover { background: var(--mint); color: var(--panel); }
.boostbar { height: 4px; background: var(--panel-sunk); border-radius: 2px; overflow: hidden; }
.boostbar i { display: block; height: 100%; background: var(--amber); }

/* ── pulse log ────────────────────────────────────────────────────────────── */

button.pulse {
  display: grid; grid-template-columns: 44px 40px 1fr auto; gap: 8px; align-items: baseline;
  font-family: var(--mono); font-size: var(--step--1); width: 100%; text-align: left;
  background: none; border: 0; border-radius: 5px; padding: 2px 5px; cursor: pointer; color: inherit;
}
button.pulse:hover { background: var(--panel-sunk); }
button.pulse:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
button.pulse[disabled] { cursor: default; }
.pulse .tier { color: var(--ink-dim); }
.pulse[data-tier="wake"] .tier { color: var(--mint); }
.pulse .find { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pulse.gap, .pulse.gap .find { color: var(--coral); }
.pulse.rolled .find { color: var(--ink-dim); }

/* ── spend ────────────────────────────────────────────────────────────────── */

.spark { width: 100%; height: 34px; display: block; }
.rolebar { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-family: var(--mono); font-size: var(--step--1); }
.rolebar .track { grid-column: 1 / -1; height: 3px; background: var(--panel-sunk); border-radius: 2px; overflow: hidden; }
.rolebar .track i { display: block; height: 100%; background: var(--violet); }

/* ── drawer ───────────────────────────────────────────────────────────────── */

.scrim { position: fixed; inset: 0; background: rgba(6,9,13,.42); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(640px, 96vw);
  background: var(--panel); border-left: 1px solid var(--rule);
  transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.7,.3,1);
  display: flex; flex-direction: column; z-index: 2;
}
.drawer.on { transform: none; }
/* The composer is the one drawer that is not a side panel. Replying to Ordis
   means reading the proposal and drafting against it, and 640px of column with
   a textarea at the bottom makes you scroll between the two halves of the one
   thought. Full width, proposal pinned above, editor below. */
.drawer.wide { width: min(1100px, 100vw); }
.compose { display: flex; flex-direction: column; gap: 12px; }
.compose .proposal {
  border: 1px solid var(--amber); background: var(--amber-ground);
  border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px;
  max-height: 34vh; overflow-y: auto;
}
.compose .proposal .r { font-size: var(--step-1); line-height: 1.35; }
.compose .proposal .rec { font-size: var(--step-0); color: var(--ink-soft); white-space: pre-wrap; }
.compose .thread { display: flex; flex-direction: column; gap: 8px; }
.msg { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
.msg .who { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.msg .bubble {
  padding: 8px 11px; border-radius: 8px; white-space: pre-wrap;
  background: var(--panel-sunk); border: 1px solid var(--rule-soft); font-size: var(--step-0);
}
.msg.po { align-self: flex-end; }
.msg.po .who { text-align: right; }
.msg.po .bubble { background: var(--amber-ground); border-color: var(--amber); }
.msg.ordis .bubble { border-left: 2px solid var(--violet); }
.msg.pending .bubble { border-style: dashed; }
textarea.compose-box {
  width: 100%; min-height: 210px; resize: vertical;
  background: var(--panel-sunk); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 11px 13px;
  font-family: var(--mono); font-size: var(--step-0); line-height: 1.55;
}
textarea.compose-box:focus-visible { outline: 2px solid var(--violet); outline-offset: -1px; }
.compose .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.compose .foot .hint { color: var(--ink-dim); font-size: var(--step--1); flex: 1; min-width: 180px; }

/* ── the file tree ────────────────────────────────────────────────────────── */

.tree { display: flex; flex-direction: column; gap: 0; font-family: var(--mono); font-size: var(--step--1); }
.tree .node {
  display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
  background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
  padding: 3px 6px; border-radius: 5px;
}
.tree .node:hover { background: var(--panel-sunk); }
.tree .node:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
.tree .node .tw { width: 9px; color: var(--ink-dim); font-size: 9px; flex: none; }
.tree .node .ic { width: 13px; flex: none; color: var(--ink-dim); }
.tree .node.dir .nm { color: var(--ink); }
.tree .node .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); }
.tree .node .n  { color: var(--ink-dim); font-size: 10px; }
/* State is a dot, not a colour on the filename: the name has to stay legible
   and the dot has to be readable at a glance from across the panel. */
.tree .node .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.tree .dot.modified  { background: var(--violet); }
.tree .dot.added     { background: var(--mint); }
.tree .dot.deleted   { background: var(--coral); }
.tree .dot.untracked { background: var(--ink-dim); }
.tree .kids { margin-left: 11px; border-left: 1px solid var(--rule-soft); padding-left: 4px; }
.tree .node.pj .nm { color: var(--amber); }
@media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none } }
.drawer header { display: flex; gap: 10px; align-items: flex-start; padding: 15px 17px 12px; border-bottom: 1px solid var(--rule); }
.drawer header h3 { margin: 0; font-size: var(--step-2); font-weight: 600; }
.drawer .scroll { overflow-y: auto; padding: 14px 17px 34px; display: flex; flex-direction: column; gap: 16px; }

.ev { display: grid; grid-template-columns: 13px 1fr; gap: 10px; }
.ev .spine { display: flex; flex-direction: column; align-items: center; }
.ev .node { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); margin-top: 6px; }
.ev .stem { flex: 1; width: 1px; background: var(--rule); margin-top: 3px; }
.ev:last-child .stem { display: none; }
.ev[data-kind="learning"] .node { background: var(--violet); }
.ev[data-kind="escalated"] .node,
.ev[data-kind="blocked"]   .node { background: var(--amber); }
.ev[data-kind="groomed"]   .node { background: var(--mint); }
.ev .when { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
.ev .sum  { font-size: var(--step-0); }
.ev .detail, pre.detail {
  margin: 5px 0 0; padding: 8px 10px; background: var(--panel-sunk); border-radius: 6px;
  font-family: var(--mono); font-size: var(--step--1); color: var(--ink-soft); white-space: pre-wrap;
  overflow-x: auto; max-height: 420px; overflow-y: auto;
}
pre.detail.tall { max-height: 60vh; }
/* A diff is the one place on this page where colour is not rationed — it is
   the whole point of the view. */
pre.diff { white-space: pre; }
pre.diff .plus  { color: var(--mint); }
pre.diff .minus { color: var(--coral); }
pre.diff .hunk  { color: var(--violet); }
pre.diff .file  { color: var(--ink); font-weight: 600; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-family: var(--mono); font-size: var(--step--1); }
.kv dt { color: var(--ink-dim); }
.kv dd { margin: 0; word-break: break-word; }
table.runs { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: var(--step--1); }
table.runs th { text-align: left; font-weight: 600; color: var(--ink-dim); border-bottom: 1px solid var(--rule); padding: 3px 8px 3px 0; }
table.runs td { padding: 3px 8px 3px 0; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
table.runs td.num { text-align: right; padding-right: 0; }
.wrap-x { overflow-x: auto; }
.blk { display: flex; flex-direction: column; gap: 5px; }
.blk > .lb { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.form { display: grid; grid-template-columns: auto 1fr; gap: 7px 10px; align-items: center;
        background: var(--panel-sunk); padding: 10px 12px; border-radius: 7px; }
.form label { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-dim); }
.form .wide { grid-column: 1 / -1; }

/* ── toasts ───────────────────────────────────────────────────────────────── */

#toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5;
          display: flex; flex-direction: column; gap: 7px; align-items: center; pointer-events: none; }
.toast {
  padding: 9px 15px; border-radius: 7px; max-width: 70vw;
  background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow);
  font-size: var(--step-0); color: var(--ink);
}
.toast.bad { border-color: var(--coral); color: var(--coral); }
.toast.good { border-color: var(--mint); color: var(--mint); }
</style>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const STATUS_LABEL = {
  "backlog": "backlog", "needs-info": "needs info", "needs-criteria": "needs criteria",
  "ready": "ready", "in-progress": "running", "po-review": "po review", "accepted": "done",
};

// ── formatting ──────────────────────────────────────────────────────────────
// Tokens are the unit; dollars are always the grayed secondary (§6).
function toks(n) {
  if (!n) return "—";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}
function usd(v) { return v ? "$" + Number(v).toFixed(2) : ""; }
function parseTs(s) { return s ? new Date(s.replace(" ", "T")) : null; }
function clock(sec) {
  if (sec == null || isNaN(sec)) return "—";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m >= 60 ? Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") : m + "m" + String(s).padStart(2, "0");
}
function hhmm(s) { return s ? s.slice(11, 16) : ""; }
function ago(s) {
  const d = parseTs(s); if (!d) return "";
  const mins = (Date.now() - d) / 6e4;
  if (mins < 60) return Math.max(0, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  return Math.round(mins / 1440) + "d ago";
}
function until(s) {
  const d = parseTs(s); if (!d) return "—";
  const mins = (d - Date.now()) / 6e4;
  if (mins < 0) return "overdue by " + Math.round(-mins) + "m";
  if (mins < 90) return "in " + Math.round(mins) + "m";
  return "in " + Math.round(mins / 60) + "h";
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // textContent, always: ledger text is data, not markup
  return n;
}

// ── writing to the colony ───────────────────────────────────────────────────
// One function for every control on the page. The custom header is what stops
// a stray page in a browser from POSTing here across origins; the server
// requires it (see server.py). Refusals come back as 409 with the reason
// written for a person — so show that text, not "request failed".

async function act(path, body) {
  try {
    const res = await fetch("/api/act/" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Colony": "1" },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { toast(data.detail || ("refused (" + res.status + ")"), "bad"); return null; }
    refresh();
    return data;
  } catch (err) {
    toast("the ledger did not answer — is the server still up?", "bad");
    return null;
  }
}

function toast(text, kind) {
  const t = el("div", "toast" + (kind ? " " + kind : ""), text);
  $("toasts").append(t);
  setTimeout(() => t.remove(), 6000);
}

function refresh() {
  fetch("/api/state").then((r) => r.json()).then(render).catch(() => {});
}

// ── avatars ─────────────────────────────────────────────────────────────────
// A hired persona's identity carries from the roster file through to the running
// agent (§9.3): same seed, same face, every run. Mirrored down the vertical axis
// so eight bits of noise read as a character.
function hash32(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function drawAvatar(canvas, seed, color) {
  const S = 8, px = 4;
  canvas.width = S * px; canvas.height = S * px;
  const ctx = canvas.getContext("2d");
  let h = hash32(seed || "anon");
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const tint = color || `hsl(${Math.floor(hash32(seed || "anon") % 360)} 52% 58%)`;
  const style = getComputedStyle(document.body);
  ctx.fillStyle = style.getPropertyValue("--panel-sunk").trim() || "#111";
  ctx.fillRect(0, 0, S * px, S * px);
  ctx.fillStyle = tint;
  for (let y = 1; y < S - 1; y++) {
    for (let x = 0; x < S / 2; x++) {
      if (rnd() > 0.5) {
        ctx.fillRect(x * px, y * px, px, px);
        ctx.fillRect((S - 1 - x) * px, y * px, px, px);
      }
    }
  }
}

// ── render ──────────────────────────────────────────────────────────────────

let STATE = null;
let filter = null;      // board column filter; null = everything
let openDivisions = new Set();   // survives re-renders; the SSE feed is frequent

function render(s) {
  STATE = s;
  document.body.classList.toggle("halted", !!s.controls.halted);
  document.body.classList.toggle("beating", !s.controls.halted);
  $("halt-why").textContent = s.controls.halt_reason || "";
  renderSprint(s.sprint);
  renderOrdis(s.ordis);
  renderColony(s.colony);
  renderBoard(s.board);
  renderProjects(s.projects);
  renderInbox(s.inbox);
  renderMacros(s.controls);
  renderPulses(s.pulses);
  renderForge(s.forge);
  renderSpend(s.spend);
  renderDivisions(s.roster);
  $("roster-count").textContent = s.roster.total + " personas";
}

function tag(text, cls) { const b = el("span"); b.append(el("b", cls || null, text)); return b; }

function renderSprint(sp) {
  const sprint = sp.sprint, spent = sp.spent || {}, usage = sp.usage, band = sp.allowance;
  $("goal").textContent = sprint ? (sprint.goal || sprint.name) : "no active sprint";
  $("spend-tok").textContent = toks(spent.tokens) + " tok";
  $("spend-usd").textContent = usd(spent.usd);

  const meta = $("sprint-meta");
  meta.replaceChildren();
  if (sprint) {
    const start = parseTs(sprint.starts_on + " 00:00:00"), end = parseTs(sprint.ends_on + " 00:00:00");
    const day = Math.min(7, Math.max(1, Math.round((Date.now() - start) / 864e5) + 1));
    const total = Math.max(1, Math.round((end - start) / 864e5));
    meta.append(
      tag(sprint.name), tag("day " + day + "/" + total),
      tag(spent.runs + " run" + (spent.runs === 1 ? "" : "s")),
      // The designed baseline stays visible next to the exception, so a boosted
      // week never quietly becomes the new normal.
      tag(band.boost
        ? `allowance ${band.effective}% of week (${band.base}% +${band.boost} boost)`
        : `allowance ${band.base}% of week`, band.boost ? "boosted" : null),
    );
  }

  const week = $("week-meta");
  week.replaceChildren();
  if (usage) {
    week.append(tag("week " + Number(usage.seven_day_pct).toFixed(1) + "%"),
                tag("5h " + Number(usage.five_hour_pct).toFixed(0) + "%"),
                tag("resets " + (usage.seven_day_resets_at || "").slice(0, 16)));
  } else {
    week.append(tag("no usage sample — is the tray app running?"));
  }

  // The bar measures spend against the colony's *allowance*, not the whole week:
  // 35% of the window is the ceiling, so 35% consumed has to read as full.
  const ceiling = band.effective || 35;
  const pct = usage ? Math.min(100, (usage.seven_day_pct / ceiling) * 100) : 0;
  const g = $("gauge");
  g.firstElementChild.style.width = pct + "%";
  g.dataset.state = pct >= 100 ? "hot" : pct >= 80 ? "warm" : "ok";
  $("spend-of").textContent = usage
    ? `week ${usage.seven_day_pct.toFixed(0)}% of ${ceiling}% allowed` : "";
}

function renderOrdis(o) {
  const box = $("ordis");
  box.replaceChildren();
  const last = o.last;
  $("ordis-count").textContent = last ? hhmm(last.pulse_at) : "never beat";

  const head = el("div", "ordis-head");
  head.append(el("div", "sigil", "◈"));
  const right = el("div");
  right.append(el("div", "state", o.halted ? "halted" : (o.running ? "working" : "watching")));
  right.append(el("div", "sub", last
    ? `last beat ${ago(last.pulse_at)} · next ${until(last.next_pulse_at)}`
    : "no heartbeat recorded yet"));
  head.append(right);
  box.append(head);

  const grid = el("div", "ordis-grid");
  const cell = (n, lb) => { const d = el("div"); d.append(el("span", "n", n), el("span", "lb", lb)); return d; };
  grid.append(cell(String(o.beats), "beats"), cell(String(o.wakes), "wakes"), cell(toks(o.tokens), "spent"));
  grid.append(cell(String(o.groomable), "to groom"), cell(String(o.queued), "dispatched"),
              cell(String(o.anomalies), "anomalies"));
  box.append(grid);

  if (last) {
    // The Scrum Master's own last sentence, in its own words. This is the one
    // place on the page where the loop gets to speak rather than be counted.
    box.append(el("div", "ordis-said", "“" + (last.finding || "clean") + "”"));
    const b = el("button", "act", "read the last beat");
    b.onclick = () => openPulse(last.id);
    box.append(b);
  }
}

function renderColony(c) {
  const box = $("colony");
  box.replaceChildren();
  $("colony-count").textContent = c.running.length ? c.running.length + " running" : "idle";

  for (const r of c.running) {
    box.append(agentRow({
      seed: r.avatar_seed || r.agent_role, color: r.color, role: r.agent_role,
      scope: r.project || "structural",
      line: (r.ticket_title || "t" + r.ticket_id),
      tokens: r.tokens, ceiling: r.max_tokens_run, live: true, started: parseTs(r.started_at),
    }));
  }
  for (const a of c.standby) {
    if (c.running.some((r) => r.agent_role === a.role)) continue;
    box.append(agentRow({
      seed: a.avatar_seed, color: a.color, role: a.role, scope: a.project || "structural",
      line: `${a.model.replace("claude-", "")} · ${a.write_capable ? "write" : "read-only"} · ${a.run_count} run${a.run_count === 1 ? "" : "s"}`,
      tokens: null, ceiling: a.max_tokens_run, live: false, agent: a,
    }));
  }
  if (!box.children.length) box.append(el("div", "empty", "nobody hired yet — open a persona in Standby to hire"));
  tickElapsed();   // paint now; the ticker only refreshes from the next second
}

function agentRow(o) {
  const row = el("div", "agent" + (o.live ? "" : " idle"));
  const cv = document.createElement("canvas");
  drawAvatar(cv, o.seed, o.color);
  if (o.live) cv.classList.add("pulsing");
  const right = el("div");
  const who = el("div", "who");
  who.append(el("span", "role", o.role), el("span", "scope", o.scope));
  right.append(who, el("div", "line", o.line));

  if (o.live) {
    // Elapsed time is painted by the one global ticker below, not a timer per
    // row: this panel re-renders on every state push, and a per-row interval
    // would leave a timer behind for every frame the page has ever drawn.
    const stat = el("div", "line mono elapsed");
    stat.dataset.started = o.started.getTime();
    stat.dataset.tokens = o.tokens || 0;
    right.append(stat);
  }
  // The bar is tokens against this agent's ceiling — Lloyd measures context, we
  // measure the thing we actually budget.
  if (o.ceiling) {
    const bar = el("div", "ceiling");
    const pct = Math.min(100, ((o.tokens || 0) / o.ceiling) * 100);
    bar.dataset.state = pct >= 90 ? "hot" : "ok";
    const fill = el("i"); fill.style.width = pct + "%";
    bar.append(fill); right.append(bar);
  }
  if (o.agent) {
    const acts = el("div", "row-acts");
    const info = el("button", "act", "contract");
    info.onclick = () => openAgent(o.agent.id);
    acts.append(info);
    if (o.agent.project) {                       // structural roles cannot be retired
      const r = el("button", "act no", "retire");
      r.onclick = () => confirmThen(`Retire ${o.agent.role}? Its history stays in the ledger.`,
                                    () => act("retire", { agent_id: o.agent.id }));
      acts.append(r);
    }
    right.append(acts);
  }
  row.append(cv, right);
  return row;
}

function tickElapsed() {
  for (const n of document.querySelectorAll(".elapsed")) {
    const secs = (Date.now() - Number(n.dataset.started)) / 1000;
    n.textContent = `${clock(secs)} · ${toks(Number(n.dataset.tokens))} tok`;
  }
}
setInterval(tickElapsed, 1000);

function renderBoard(b) {
  const flow = $("flow");
  flow.replaceChildren();
  let total = 0;
  for (const c of b.columns) {
    total += c.n;
    const btn = el("button");
    btn.setAttribute("aria-pressed", String(filter === c.status));
    btn.append(el("span", "n" + (c.n ? "" : " zero"), String(c.n)), el("span", "lb", STATUS_LABEL[c.status] || c.status));
    btn.onclick = () => { filter = filter === c.status ? null : c.status; renderBoard(STATE.board); };
    flow.append(btn);
  }
  $("board-count").textContent = total + " open";

  const box = $("stories");
  box.replaceChildren();
  const shown = b.stories.filter((s) => !filter || s.status === filter);
  if (!shown.length) { box.append(el("div", "empty", filter ? "nothing in " + STATUS_LABEL[filter] : "board empty")); return; }

  for (const s of shown) {
    const card = el("button", "story");
    card.append(el("span", "t", s.title));
    card.append(el("span", "chip" + (s.status === "in-progress" ? " live" : ["needs-info", "po-review"].includes(s.status) ? " attn" : ""),
                    STATUS_LABEL[s.status] || s.status));
    const sub = el("span", "sub");   // a card is a <button>: phrasing content only
    if (s.priority === 1) sub.append(el("span", "chip p1", "high"));
    if (s.project) {
      // An inference is not a permission. Show the guess, mark it as a guess.
      const p = el("span", s.project_source === "confirmed" ? "" : "guess", s.project);
      p.title = s.project_source === "confirmed" ? "confirmed by you" : "inferred — cannot authorise a write";
      sub.append(p);
    } else {
      sub.append(el("span", "dim", "no project"));
    }
    if (s.tokens) sub.append(el("span", null, toks(s.tokens) + " tok"));
    if (s.events) sub.append(el("span", "dim", s.events + " event" + (s.events === 1 ? "" : "s")));
    sub.append(el("span", "dim", ago(s.updated_at)));
    card.append(sub);
    card.onclick = () => openStory(s.id);
    box.append(card);
  }
}

function renderProjects(rows) {
  const box = $("projects");
  box.replaceChildren();
  $("proj-count").textContent = rows.length ? rows.length + " with changes" : "all clean";
  if (!rows.length) { box.append(el("div", "empty", "every project matches its last commit")); return; }

  const max = Math.max(...rows.map((r) => r.dirty_files || 1), 1);
  for (const r of rows) {
    const b = el("button", "proj");
    b.append(el("span", "p", r.project), el("span", "s", r.summary));
    const bar = el("div", "bar");
    const seg = (n, cls) => { if (!n) return; const i = el("i", cls); i.style.width = (n / max) * 100 + "%"; bar.append(i); };
    seg(r.added, "a"); seg(r.modified, "m"); seg(r.deleted, "d"); seg(r.untracked, "u");
    b.append(bar);
    b.title = `${r.project} @ ${r.branch || "?"} ${r.head_sha || ""}`;
    b.onclick = () => openProject(r.project);
    box.append(b);
  }
}

// ── the file tree ───────────────────────────────────────────────────────────
//
// The Projects list above answers "what moved"; a project with a clean tree
// vanishes from it, which is correct for the pulse log and useless as a file
// manager. This is the other half: everything that is there, lazily, one folder
// per request, with change state hung off it as a dot.
//
// Open folders are remembered in a Set of paths rather than in the DOM, so a
// refresh — a snapshot arriving, a rescan — re-renders the same shape instead
// of collapsing everything the user opened.

const TREE_OPEN = new Set();
let TREE_FILTER = "";

async function renderTree() {
  const box = $("tree");
  box.replaceChildren(el("div", "empty", "reading the tree…"));
  try {
    const root = await getJSON("/api/tree?path=");
    box.replaceChildren();
    box.append(await treeLevel(root, ""));
  } catch {
    box.replaceChildren(el("div", "empty", "could not read the projects folder"));
  }
}

async function treeLevel(data, path) {
  const frag = document.createDocumentFragment();
  const q = TREE_FILTER.toLowerCase();
  // The filter applies to the top level only — it is there to find a project in
  // a list of sixty, not to search the disk. Filtering every level would make
  // an open folder disappear out from under the cursor.
  for (const d of data.dirs) {
    if (!path && q && !d.name.toLowerCase().includes(q)) continue;
    frag.append(await treeDir(d));
  }
  for (const f of data.files) {
    if (!path && q && !f.name.toLowerCase().includes(q)) continue;
    frag.append(treeFile(f));
  }
  if (!frag.childNodes.length) frag.append(el("div", "empty", "nothing here"));
  return frag;
}

async function treeDir(d) {
  const wrap = el("div");
  const row = el("button", "node dir" + (d.project ? " pj" : ""));
  const tw = el("span", "tw", TREE_OPEN.has(d.path) ? "▾" : "▸");
  row.append(tw, el("span", "ic", "▣"), el("span", "nm", d.name));
  if (d.changed) {
    row.append(el("span", "n", d.changed));
    row.append(el("span", "dot modified"));
  }
  row.title = d.path + (d.project ? "  ·  a project (has a PROJECT.md)" : "");
  wrap.append(row);

  const kids = el("div", "kids");
  kids.style.display = TREE_OPEN.has(d.path) ? "" : "none";
  wrap.append(kids);

  const load = async () => {
    kids.replaceChildren(el("div", "empty", "…"));
    try {
      const data = await getJSON("/api/tree?path=" + encodeURIComponent(d.path));
      kids.replaceChildren();
      kids.append(await treeLevel(data, d.path));
    } catch {
      kids.replaceChildren(el("div", "empty", "could not open that folder"));
    }
  };
  if (TREE_OPEN.has(d.path)) load();

  row.onclick = () => {
    const open = TREE_OPEN.has(d.path);
    if (open) { TREE_OPEN.delete(d.path); kids.style.display = "none"; tw.textContent = "▸"; }
    else { TREE_OPEN.add(d.path); kids.style.display = ""; tw.textContent = "▾"; load(); }
  };
  return wrap;
}

function treeFile(f) {
  const row = el("button", "node file");
  row.append(el("span", "tw", ""), el("span", "ic", "▤"), el("span", "nm", f.name));
  if (f.state) row.append(el("span", "dot " + f.state));
  row.title = f.path + "  ·  " + (f.size > 1024 ? Math.round(f.size / 1024) + " KB" : f.size + " B") +
              (f.state ? "  ·  " + f.state : "");
  row.onclick = () => openFile(f);
  return row;
}

async function openFile(f) {
  const body = openDrawer(f.state ? f.state : "file", f.name);
  const blocks = [];
  blocks.push(el("div", "meta mono dim", f.path));
  // A changed file leads with its diff — that is why it is interesting — and
  // still offers the whole text underneath.
  if (f.state && f.state !== "untracked") {
    try {
      const project = f.path.split("/")[0];
      const d = await getJSON("/api/diff?project=" + encodeURIComponent(project) +
                              "&path=" + encodeURIComponent(f.path));
      const pre = el("pre", "detail diff tall");
      paintDiff(pre, d.diff || "(nothing uncommitted)");
      blocks.push(blk("working-tree diff", pre));
    } catch { /* fall through to the text */ }
  }
  try {
    const data = await getJSON("/api/file?path=" + encodeURIComponent(f.path));
    blocks.push(data.text == null
      ? el("div", "empty", data.why || "nothing to show")
      : blk("contents", el("pre", "detail tall", data.text)));
  } catch {
    blocks.push(el("div", "empty", "this dashboard will not open that file"));
  }
  body.replaceChildren(...blocks);
}

function renderInbox(items) {
  const box = $("inbox"), strip = $("inbox-strip");
  box.replaceChildren();
  $("inbox-count").textContent = items.length ? items.length + " waiting on you" : "";
  strip.classList.toggle("quiet", items.length === 0);
  if (!items.length) {
    // An empty Inbox means the system is working. It gets to look like it —
    // and, up here at full width, it gets to take up almost no room.
    box.append(el("div", "empty", "empty — nothing needs you"));
    return;
  }
  for (const e of items) box.append(inboxTile(e));
}

function inboxTile(e) {
  const card = el("div", "tile");
  card.dataset.kind = e.kind;
  if (e.snoozed) card.classList.add("snoozed");
  const k = el("div", "k");
  k.append(el("span", null, e.kind.replace("-", " ")), el("span", "age", ago(e.raised_at)));
  card.append(k, el("div", "r", e.reason));
  if (e.recommendation) card.append(el("div", "rec", e.recommendation));
  if (e.snoozed) {
    card.append(el("div", "snooze-note", "snoozed · back " + until(e.snoozed_until)));
  }
  // The conversation, in the two states it can be in. Both belong on the face
  // of the tile: a reply nobody can see from the Inbox is a reply nobody reads.
  if (e.last_reply) {
    const said = el("div", "said", e.last_reply);
    said.title = "Ordis answered your reply";
    card.append(said);
  }
  if (e.awaiting_ordis) {
    card.append(el("div", "waiting",
      e.awaiting_ordis + " repl" + (e.awaiting_ordis === 1 ? "y" : "ies") +
      " queued — Ordis answers on the next pulse"));
  }

  const meta = [];
  if (e.story_title) meta.push(e.story_title);
  if (e.est_tokens) meta.push(toks(e.est_tokens) + " tok");
  if (meta.length) card.append(el("div", "meta", meta.join("  ·  ")));

  const acts = el("div", "acts");

  // A story whose folder is still a guess is the single most common thing in
  // this Inbox, and it has exactly one answer: name the folder. So the answer
  // is on the tile rather than two clicks into a drawer.
  //
  // The kind decides what else belongs here. A `needs-info` escalation *is* the
  // question "which folder?" — approving it would approve nothing — so it gets
  // the picker alone. A `decision` is a real yes/no that may also happen to sit
  // on an unconfirmed story, so it gets both.
  const unconfirmed = e.story_id && e.project_source !== "confirmed";
  const asksForProject = e.kind === "needs-info";
  if (unconfirmed) {
    // The picker sits on its own full-width row. Two answers are possible and
    // the second one — "none of these, it's new" — used to have nowhere to go:
    // choosing it swaps the <select> for a text field and confirms against a
    // folder that gets created on the spot.
    const row = el("div", "picker");
    const sel = projectSelect(e.project, { allowNew: true });
    const field = el("input", "field");
    field.placeholder = "new-folder-name";
    field.style.display = "none";
    const go = el("button", "act go", "confirm project");

    sel.onchange = () => {
      const isNew = sel.value === NEW_PROJECT;
      field.style.display = isNew ? "" : "none";
      sel.style.display = isNew ? "none" : "";
      go.textContent = isNew ? "create + confirm" : "confirm project";
      if (isNew) field.focus();
    };
    field.onkeydown = (ev) => {
      if (ev.key === "Escape") { sel.value = ""; sel.onchange(); }
      if (ev.key === "Enter") go.click();
    };
    go.onclick = () => {
      const isNew = sel.value === NEW_PROJECT;
      const name = isNew ? field.value.trim() : sel.value;
      if (!name) {
        toast(isNew ? "name the new folder" : "pick the folder this story belongs to first", "bad");
        return;
      }
      act("confirm-project", {
        story_id: e.story_id, project: name, create: isNew,
        why: isNew ? e.story_title || e.reason : "",
      });
    };
    row.append(sel, field, go);
    acts.append(row);
  }

  if (e.kind === "write-approval") {
    const view = el("button", "act", "read the patch");
    view.onclick = () => openPatch(e);
    const yes = el("button", "act go", "apply");
    yes.onclick = () => confirmThen(
      "Apply this patch to the live tree? It lands uncommitted — you still review and commit it yourself.",
      () => act("decide", { escalation_id: e.id, decision: "approve" }));
    const no = el("button", "act no", "reject");
    no.onclick = () => act("decide", { escalation_id: e.id, decision: "reject" });
    acts.append(view, yes, no);
  } else if (!asksForProject) {
    const yes = el("button", "act go", "approve");
    yes.onclick = () => act("decide", { escalation_id: e.id, decision: "approve" });
    const no = el("button", "act no", "reject");
    no.onclick = () => act("decide", { escalation_id: e.id, decision: "reject" });
    acts.append(yes, no);
  }

  // Reply. The button that makes this an Inbox rather than a set of switches:
  // most of what a PO actually needs to say is a sentence, and every other
  // control here can only say one of two things.
  const say = el("button", "act warn",
                 e.messages ? "reply · " + e.messages : "reply to Ordis");
  say.title = "write to Ordis about this item — queued for the next pulse";
  say.onclick = () => openCompose(e);
  acts.append(say);

  // Later is a snooze with an end on it. It stays in the Inbox — an Inbox you
  // can empty without deciding anything stops meaning what it says — but it
  // grays out and sorts to the back until the snooze expires.
  if (e.snoozed) {
    const wake = el("button", "act", "un-snooze");
    wake.title = "bring it back to the front of the Inbox now";
    wake.onclick = () => act("decide", { escalation_id: e.id, decision: "defer", snooze_hours: 0 });
    acts.append(wake);
  } else {
    const later = el("button", "act", "later");
    later.title = "snooze 8h — it stays in the Inbox, dimmed, because nothing was decided";
    later.onclick = () => act("decide", { escalation_id: e.id, decision: "defer", snooze_hours: 8 });
    acts.append(later);
  }

  if (e.story_id) {
    // Named for what it opens. "story" read like a category label on the tile;
    // it is a link to the story's own timeline, criteria and events.
    const open = el("button", "act", "open story");
    open.title = "the full story: brief, acceptance criteria, every event on it";
    open.onclick = () => openStory(e.story_id);
    acts.append(open);
  }
  card.append(acts);
  return card;
}

// ── the composer ────────────────────────────────────────────────────────────
//
// Typing to Ordis, with the thing you are answering pinned above the box. The
// drawer goes wide for this one view: drafting a reply while re-reading a
// proposal in a 640px column means scrolling between the two halves of one
// thought.

async function openCompose(e) {
  openDrawer(e.kind.replace("-", " ") + " · #" + e.id, "Reply to Ordis", { wide: true });
  const box = $("d-body");
  box.replaceChildren();
  const wrap = el("div", "compose");

  const proposal = el("div", "proposal");
  proposal.append(el("div", "r", e.reason));
  if (e.recommendation) proposal.append(el("div", "rec", e.recommendation));
  const meta = [];
  if (e.story_title) meta.push(e.story_title);
  if (e.project) meta.push(e.project + (e.project_source === "confirmed" ? "" : " (guess)"));
  if (e.est_tokens) meta.push(toks(e.est_tokens) + " tok");
  meta.push("raised " + ago(e.raised_at));
  proposal.append(el("div", "meta", meta.join("  ·  ")));
  wrap.append(proposal);

  const thread = el("div", "thread");
  wrap.append(thread);

  const ta = el("textarea", "compose-box");
  ta.placeholder =
    "Write to Ordis the way you would in a terminal.\n\n" +
    "He reads this on the next pulse, answers in the same thread, and revises " +
    "his recommendation if you have changed it. He cannot approve, reject or " +
    "confirm a project from your reply — those stay yours.";
  wrap.append(ta);

  const foot = el("div", "foot");
  const send = el("button", "act go", "send to ordis");
  const hint = el("span", "hint",
    "queued, not sent — nothing here spends a token until the next pulse. Ctrl+Enter sends.");
  foot.append(send, hint);
  wrap.append(foot);
  box.append(wrap);
  ta.focus();

  const load = async () => {
    thread.replaceChildren();
    const data = await getJSON("/api/thread?escalation_id=" + e.id);
    for (const m of (data.messages || [])) {
      const row = el("div", "msg " + (m.author === "po" ? "po" : "ordis") +
                              (m.status === "unread" ? " pending" : ""));
      row.append(el("div", "who",
        (m.author === "po" ? "you" : "ordis") + " · " + ago(m.at) +
        (m.status === "unread" ? " · not read yet" : "")));
      row.append(el("div", "bubble", m.body));
      thread.append(row);
    }
  };
  load();

  const submit = async () => {
    const body = ta.value.trim();
    if (!body) { toast("nothing to send", "bad"); return; }
    send.disabled = true;
    const ok = await act("reply", { escalation_id: e.id, story_id: e.story_id, body });
    send.disabled = false;
    if (ok) {
      ta.value = "";
      load();
      toast("queued — Ordis reads it on the next pulse", "good");
    }
  };
  send.onclick = submit;
  ta.onkeydown = (ev) => {
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); submit(); }
  };
}

// The sentinel for "none of the folders on this list". A constant rather than a
// magic string in three places, and one that cannot collide with a real folder
// name because a real folder name can never contain a newline.
const NEW_PROJECT = "\n<new>";

function projectSelect(current, opts) {
  const sel = el("select", "pick");
  sel.append(el("option", null, "— name the folder —"));
  sel.firstChild.value = "";
  // `STATE` may not have arrived yet — a deep-linked drawer opens before the
  // first snapshot does — and a picker with no options is a far better failure
  // than a drawer that renders nothing because one list was undefined.
  const all = ALL_PROJECTS.length
    ? ALL_PROJECTS
    : ((STATE && STATE.projects) || []).map((r) => r.project);
  for (const p of all) {
    const o = el("option", null, p);
    o.value = p;
    if (p === current) o.selected = true;
    sel.append(o);
  }
  if (opts && opts.allowNew) {
    const o = el("option", null, "＋ new project folder…");
    o.value = NEW_PROJECT;
    sel.append(o);
  }
  return sel;
}

function renderMacros(c) {

    ? `${band.base}% baseline + ${band.boost} boost = ${band.effective}% of the week.`
    : `${band.base}% of the week, as designed. Add points for a high-volume sprint.`));
  const row = el("div", "row");
  for (const step of [5, 10, 25]) {
    const b = el("button", "act warn", "+" + step);
    b.title = `raise the allowance to ${Math.min(c.max_boost, band.boost + step)} points above baseline`;
    b.disabled = band.boost >= c.max_boost;
    b.onclick = () => act("allowance", { boost: Math.min(c.max_boost, band.boost + step) });
    row.append(b);
  }
  const clr = el("button", "act", "clear");
  clr.disabled = !band.boost;
  clr.title = "back to the designed baseline";
  clr.onclick = () => act("allowance", { boost: 0 });
  row.append(clr);
  al.append(row);
  box.append(al);
  box.append(el("hr", "macro-rule"));

  // Housekeeping.

  rescan.title = "re-read the agency-agents install from disk";
  rescan.onclick = async () => {
    const out = await act("rescan", {});
    if (out) toast(`${out.total} personas · ${out.added.length} new · ${out.changed.length} changed`, "good");
  };
  const reload = el("button", "act", "reload page");
  reload.onclick = () => location.reload();

      const d = el("div", "why");

      log.append(d);

function renderPulses(rows) {
  const box = $("pulses");
  box.replaceChildren();
  $("pulse-count").textContent = rows.length ? hhmm(rows[0].pulse_at) : "";
  if (!rows.length) { box.append(el("div", "empty", "no pulses yet")); return; }

  // Consecutive clean ticks roll up; a *missing* hour is drawn in coral. A
  // heartbeat monitor that only shows the beats it received cannot show a
  // stopped heart, which is the one thing it exists to show.
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    const p = rows[i], prev = rows[i + 1];
    if (out.length && out[out.length - 1].roll && p.tier === "tick" && (p.finding || "") === "clean") {
      out[out.length - 1].roll++; continue;
    }
    out.push({ p, roll: p.tier === "tick" && (p.finding || "") === "clean" ? 1 : 0 });
    if (prev) {
      const gapH = (parseTs(p.pulse_at) - parseTs(prev.pulse_at)) / 36e5;
      if (gapH > 1.6) out.push({ gap: Math.round(gapH) });
    }
  }
  for (const item of out) {
    if (item.gap) {
      const row = el("button", "pulse gap");
      row.disabled = true;
      row.append(el("span", null, "—"), el("span", "tier", "miss"),
                 el("span", "find", `no pulse for ~${item.gap}h`), el("span"));
      box.append(row); continue;
    }
    const p = item.p;
    const row = el("button", "pulse" + (item.roll > 1 ? " rolled" : ""));
    row.dataset.tier = p.tier;
    row.append(
      el("span", null, hhmm(p.pulse_at)),
      el("span", "tier", p.tier),
      el("span", "find", item.roll > 1 ? `clean ×${item.roll}` : (p.finding || "")),
      el("span", "num", p.tokens ? toks(p.tokens) : ""),
    );
    row.title = p.has_detail ? "open the full account of this beat" : p.pulse_at;
    row.onclick = () => openPulse(p.id);
    box.append(row);
  }
}

function renderForge(items) {

  if (!items.length) { box.append(el("div", "empty", "no candidates — the forge turns on at M4")); return; }

    const d = el("div");
    d.append(el("div", "mono", s.name), el("div", "dim", s.summary || ""),
             el("div", "mono dim", toks(s.tokens_saved) + " tok saved"));

function renderSpend(sp) {
  const days = sp.by_day || [];
  $("spend-count").textContent = days.length ? days.length + "d" : "";

  const svg = $("spark");
  svg.replaceChildren();
  if (days.length) {
    const W = 300, H = 34, max = Math.max(...days.map((d) => d.tokens), 1);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const step = days.length > 1 ? W / (days.length - 1) : W;
    const pts = days.map((d, i) => [i * step, H - 3 - (d.tokens / max) * (H - 7)]);
    const line = pts.map((p) => p.join(",")).join(" ");
    const ns = "http://www.w3.org/2000/svg";
    const area = document.createElementNS(ns, "polygon");
    area.setAttribute("points", `0,${H} ${line} ${(days.length - 1) * step},${H}`);
    area.setAttribute("fill", "currentColor"); area.setAttribute("opacity", ".10");
    const path = document.createElementNS(ns, "polyline");
    path.setAttribute("points", line); path.setAttribute("fill", "none");
    path.setAttribute("stroke", "currentColor"); path.setAttribute("stroke-width", "1.5");
    const last = document.createElementNS(ns, "circle");
    last.setAttribute("cx", pts[pts.length - 1][0] - 1); last.setAttribute("cy", pts[pts.length - 1][1]);
    last.setAttribute("r", "2.5"); last.setAttribute("fill", "currentColor");
    svg.style.color = "var(--violet)";
    svg.append(area, path, last);
  }

  const box = $("by-role");
  box.replaceChildren();
  const max = Math.max(...(sp.by_role || []).map((r) => r.tokens), 1);
  for (const r of sp.by_role || []) {
    const d = el("div", "rolebar");
    d.append(el("span", null, r.agent_role), el("span", null, `${toks(r.tokens)} tok ${usd(r.usd)}`));
    const track = el("div", "track"); const fill = el("i");
    fill.style.width = (r.tokens / max) * 100 + "%";
    track.append(fill); d.append(track);
    // Cache reads are excluded from every budget number on this page; showing
    // the raw total next to it is what stops that from looking like a bug.
    d.append(el("span", "dim", `${r.runs} run${r.runs === 1 ? "" : "s"}`),
             el("span", "dim", `${toks(r.total_tokens)} incl. cache reads`));
    box.append(d);
  }
  if (!box.children.length) box.append(el("div", "empty", "nothing spent yet"));
}

let ALL_PROJECTS = [];   // every folder with a PROJECT.md, for the confirm pickers

function openDrawer(eyebrow, title, opts) {
  const d = $("drawer");

function closeDrawer() {

}
$("d-close").onclick = closeDrawer;
$("scrim").onclick = closeDrawer;
addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function blk(label, ...nodes) {
  const w = el("div", "blk");
  w.append(el("div", "lb", label));
  w.append(...nodes);

}
function sectionBlock(label, text) { return blk(label, el("pre", "detail", text)); }

async function openStory(id) {
  const body = openDrawer("story #" + id, "");
  let data;
  try { data = await getJSON("/api/story/" + id); }
  catch { body.replaceChildren(el("div", "empty", "could not load story " + id)); return; }

  const s = data.story;
  ALL_PROJECTS = data.projects || ALL_PROJECTS;
  $("d-eyebrow").textContent = `story #${s.id} · ${STATUS_LABEL[s.status] || s.status}`;
  $("d-title").textContent = s.title;
  body.replaceChildren();

  const facts = el("dl", "kv");
  const add = (k, v) => { facts.append(el("dt", null, k), el("dd", null, v)); };
  add("project", s.project ? `${s.project} (${s.project_source})` : "none");
  add("priority", ["", "high", "medium", "low"][s.priority] || s.priority);
  add("notion", s.notion_status || "—");
  add("synced", s.notion_synced_at || "—");
  if (s.blocked_reason) add("blocked", s.blocked_reason);
  body.append(facts);

  // The two gates that live on a story: name its folder, then dispatch it.
  const gate = el("div", "form");
  gate.append(el("label", null, "project"));
  const sel = projectSelect(s.project);
  const confirm = el("button", "act go", s.project_source === "confirmed" ? "re-confirm" : "confirm");
  confirm.onclick = async () => {
    if (!sel.value) { toast("pick a folder first", "bad"); return; }
    if (await act("confirm-project", { story_id: s.id, project: sel.value })) openStory(s.id);
  };
  const cell = el("div", "row"); cell.style.display = "flex"; cell.style.gap = "6px";
  cell.append(sel, confirm);
  gate.append(cell);

  gate.append(el("label", null, "dispatch"));
  const disp = el("button", "act go", "dispatch to build");
  disp.title = "queues one ticket. Nothing is spent until the next wake.";
  disp.onclick = async () => {
    const out = await act("dispatch", { story_id: s.id });
    if (out) { toast("queued — the next wake will build it", "good"); openStory(s.id); }
  };
  gate.append(disp);
  body.append(gate);

  if (s.description) body.append(sectionBlock("brief", s.description));
  if (s.acceptance_criteria) body.append(sectionBlock("acceptance criteria", s.acceptance_criteria));

  if (data.tickets.length) {
    const rows = el("div", "blk");
    for (const t of data.tickets) {
      const r = el("div", "kv");
      r.append(el("dt", null, `#${t.id} ${t.intent}`), el("dd", null, `${t.status} · ${t.role}`));
      rows.append(r);
      if (["staffed", "open"].includes(t.status)) {
        const c = el("button", "act no", "cancel ticket #" + t.id);
        c.onclick = async () => { if (await act("cancel", { ticket_id: t.id })) openStory(s.id); };
        rows.append(c);
      }
    }
    body.append(blk("tickets", rows));
  }

  if (data.runs.length) {
    const box = el("div", "wrap-x");
    const t = el("table", "runs");
    const head = el("tr");
    ["run", "role", "status", "chargeable", "total", "$"].forEach((h) => head.append(el("th", null, h)));
    t.append(head);
    for (const r of data.runs) {
      const tr = el("tr");
      tr.append(el("td", null, "#" + r.id), el("td", null, r.agent_role), el("td", null, r.status),
                el("td", "num", toks(r.chargeable_tokens || r.total_tokens)),
                el("td", "num dim", toks(r.total_tokens)), el("td", "num dim", usd(r.cost_usd)));
      t.append(tr);
    }
    box.append(t);
    body.append(blk("runs", box));
  }

  // The timeline is the point of the drawer: not "where is this" but "what did
  // we find out, and when". `story_events` exists to make this readable.
  const tl = el("div", "blk");
  tl.append(el("div", "lb", "timeline"));
  if (!data.events.length) tl.append(el("div", "empty", "nothing has happened to this story yet"));
  for (const e of data.events) {
    const row = el("div", "ev");
    row.dataset.kind = e.kind;
    const spine = el("div", "spine");
    spine.append(el("div", "node"), el("div", "stem"));
    const right = el("div");
    right.append(el("div", "when", `${e.at}  ·  ${e.kind}${e.tokens ? "  ·  " + toks(e.tokens) + " tok" : ""}`));
    right.append(el("div", "sum", e.summary));
    if (e.detail) right.append(el("pre", "detail", e.detail));
    row.append(spine, right);
    tl.append(row);
  }
  body.append(tl);
}

// ── persona drawer ──────────────────────────────────────────────────────────
// The whole persona file, not a summary of it. What a persona refuses, what it
// insists on, what "done" means to it — those live in the markdown body, and
// they are exactly what you need to read *before* hiring someone rather than
// discover afterwards in a diff.

async function openPersona(slug) {
  const body = openDrawer("persona", slug);
  let p;
  try { p = await getJSON("/api/persona?slug=" + encodeURIComponent(slug)); }
  catch { body.replaceChildren(el("div", "empty", "could not read that persona")); return; }

  $("d-eyebrow").textContent = `${p.division} · standby`;
  $("d-title").textContent = `${p.emoji || ""} ${p.name}`.trim();
  body.replaceChildren();

  const facts = el("dl", "kv");
  const add = (k, v) => { facts.append(el("dt", null, k), el("dd", null, v)); };
  add("slug", p.slug);
  add("division", p.division);
  if (p.vibe) add("vibe", p.vibe);
  add("file", p.path);
  if (p.hired) add("status", `hired as “${p.hired.role}”${p.hired.project ? " on " + p.hired.project : ""}`);
  body.append(facts);

  if (p.description) body.append(el("div", null, p.description));
  if (p.error) body.append(el("div", "empty", p.error));

  body.append(hireForm(p));

  // Every heading in the file becomes a block. Anything that fails to split
  // comes back as one section, which renders as the whole file — degrading to
  // "show me the text" is the right failure for a document viewer.
  for (const sec of p.sections) {
    if (!sec.body) { body.append(el("div", "lb mono dim", sec.title)); continue; }
    body.append(blk(sec.title || "criteria", el("pre", "detail tall", sec.body)));
  }
  if (!p.sections.length && p.body) body.append(sectionBlock("persona file", p.body));
}

function hireForm(p) {
  const wrap = el("div", "form");
  const role = el("input", "field");
  role.value = p.slug.split("/").pop();
  const proj = projectSelect(null);
  const model = el("select", "pick");
  for (const m of ["claude-sonnet-5", "claude-opus-5", "claude-haiku-4-5-20251001"]) {
    const o = el("option", null, m.replace("claude-", "")); o.value = m; model.append(o);
  }
  const write = el("input");
  write.type = "checkbox";
  const ceiling = el("input", "field");
  ceiling.type = "number"; ceiling.value = "120000"; ceiling.step = "10000"; ceiling.min = "10000";

  wrap.append(el("label", null, "role"), role);
  wrap.append(el("label", null, "project"), proj);
  wrap.append(el("label", null, "model"), model);
  const wline = el("div"); wline.style.display = "flex"; wline.style.gap = "7px"; wline.style.alignItems = "center";
  wline.append(write, el("span", "dim", "may edit files in that project (in a worktree, after you approve)"));
  wrap.append(el("label", null, "write"), wline);
  wrap.append(el("label", null, "ceiling"), ceiling);

  const go = el("button", "act go wide", p.hired ? "hire again" : "hire onto the colony");
  go.onclick = async () => {
    const out = await act("hire", {
      roster_slug: p.slug, role: role.value, project: proj.value || null,
      model: model.value, write_capable: write.checked,
      max_tokens_run: Number(ceiling.value) || 120000,

    if (out) { toast(`hired ${role.value}`, "good"); closeDrawer(); }
  };
  wrap.append(go);
  return wrap;
}

async function openPulse(id) {
  const body = openDrawer("pulse #" + id, "");
  let p;

  catch { body.replaceChildren(el("div", "empty", "could not load that beat")); return; }
  $("d-eyebrow").textContent = `${p.tier} · ${p.pulse_at}`;
  $("d-title").textContent = p.finding || "clean";
  body.replaceChildren();

  const facts = el("dl", "kv");
  const add = (k, v) => { facts.append(el("dt", null, k), el("dd", null, v)); };
  add("window", `${p.window_start} → ${p.window_end}`);
